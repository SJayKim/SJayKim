name: Publish portfolio diagrams
on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - 'images/architecture/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage public diagrams
        run: |
          mkdir -p _site/docs/diagrams _site/images/architecture
          cp docs/diagrams/*.html _site/docs/diagrams/
          cp images/architecture/*.png images/architecture/*.svg _site/images/architecture/
          printf '%s\n' '<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=docs/diagrams/"><title>프로젝트 구성도</title><a href="docs/diagrams/">프로젝트 구성도 열기</a></html>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
